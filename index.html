<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SudanPay — تبديل عملات فوري 🇸🇩</title>
<meta name="description" content="بدّل BTC وUSDT وETH وXMR فوراً بلا حساب. بدّل، لا تحتفظ.">
<style>
*{box-sizing:border-box;margin:0}
:root{--red:#C1121F;--red2:#E23B2E;--sand:#F0E7D8;--ink:#08060A;--line:rgba(240,231,216,.14)}
body{background:var(--ink);color:var(--sand);font:16px/1.55 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
.scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#0a0a1f;filter:saturate(115%) contrast(105%)}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(8,6,10,.55) 0%,rgba(8,6,10,.35) 40%,rgba(8,6,10,.9) 100%)}
main{position:relative;z-index:2;max-width:560px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:26px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand b{color:var(--red2)}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:11px;background:rgba(8,6,10,.5)}
h1{font-size:clamp(28px,7.4vw,46px);line-height:1.06;letter-spacing:-.035em;font-weight:800;text-shadow:0 2px 22px rgba(0,0,0,.6)}
h1 em{color:#FF6A4D;font-style:normal}
.lede{opacity:.8;font-size:14px;margin-top:9px;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.card{margin-top:22px;background:rgba(10,8,13,.8);backdrop-filter:blur(24px) saturate(140%);
border:1px solid var(--line);border-radius:26px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.leg{display:flex;justify-content:space-between;font-size:11.5px;opacity:.5;padding:12px 14px 6px}
.row{display:flex;align-items:center;gap:8px;background:rgba(240,231,216,.05);border-radius:18px;padding:9px 10px}
.row select{background:none;border:0;color:var(--sand);font:700 14px inherit;padding:8px 2px;max-width:44%;cursor:pointer}
.row select option,.row select optgroup{background:#121016;color:var(--sand)}
.row input{flex:1;min-width:0;background:none;border:0;color:var(--sand);font:700 21px inherit;text-align:left;padding:8px 4px}
.row input:focus{outline:0}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 system-ui;color:#fff;flex:0 0 auto}
.btc{background:#F7931A}.usdt{background:#26A17B}.eth{background:#627EEA}.xmr{background:#FF6600}
.trx{background:#E50914}.usdc{background:#2775CA}.sol{background:#9945FF}.ltc{background:#345D9D}.doge{background:#C2A633}
.mid{display:flex;justify-content:center;margin:-13px 0;position:relative;z-index:3}
.flip{width:42px;height:42px;border-radius:50%;background:#17131b;border:1px solid var(--line);color:var(--sand);font-size:16px;cursor:pointer;transition:.25s}
.flip:active{transform:rotate(180deg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 6px 0;background:rgba(240,231,216,.05);padding:5px;border-radius:14px}
.seg button{background:none;border:0;color:var(--sand);font:600 12.5px inherit;padding:10px;border-radius:10px;cursor:pointer;opacity:.55}
.seg button.on{background:rgba(193,18,31,.22);color:#fff;opacity:1;box-shadow:inset 0 0 0 1px rgba(226,59,46,.5)}
.fields{margin:12px 6px 0;display:grid;gap:8px}
.fields input{background:rgba(240,231,216,.05);border:1px solid transparent;border-radius:13px;padding:13px;color:var(--sand);font:inherit;font-size:13.5px}
.fields input:focus{outline:0;border-color:rgba(226,59,46,.55)}
.meta{margin:11px 10px 0;font-size:12.5px;opacity:.62;min-height:34px;line-height:1.5}
button.go{width:100%;margin:4px 0;background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;border:0;
border-radius:18px;padding:17px;font:800 15.5px inherit;cursor:pointer;box-shadow:0 10px 26px rgba(193,18,31,.35)}
button.go:disabled{opacity:.42;box-shadow:none;cursor:default}
.gh{background:rgba(240,231,216,.06);border:1px solid var(--line);color:var(--sand);border-radius:14px;padding:13px;font:600 13px inherit;width:100%;cursor:pointer}
.addr{font-family:monospace;font-size:12px;word-break:break-all;background:rgba(240,231,216,.07);padding:12px;border-radius:12px;margin:10px 0;text-align:center}
.qr{display:block;margin:12px auto;background:#fff;padding:9px;border-radius:14px}
.foot{margin-top:30px;font-size:11px;opacity:.45;line-height:1.9;text-align:center;text-shadow:0 1px 10px #000}
.foot a{color:#FF6A4D}
@media(prefers-reduced-motion:reduce){.scene{display:none}}
</style></head><body>
<video class="scene" autoplay muted loop playsinline preload="auto"
 poster="https://cdn.pixabay.com/video/2022/12/28/144575-784867452_tiny.jpg">
<source src="https://cdn.pixabay.com/video/2022/12/28/144575-784867452_large.mp4" type="video/mp4">
</video>
<div class="veil"></div>

<main>
<header><div class="brand">Sudan<b>Pay</b> 🇸🇩</div><span class="pill">بلا حساب · بلا KYC</span></header>

<section id="swap">
<h1>بدّل بسرعة<br><em>النيل</em>. بلا حساب.</h1>
<p class="lede">سعر مقفول عشر دقائق، واسترداد إلى عنوانك إن تعذّر التنفيذ.</p>

<div class="card">
<div class="leg"><span>ترسل</span></div>
<div class="row">
<span class="ico btc" id="fi">₿</span>
<select id="f">
<optgroup label="بيتكوين"><option value="BTC">BTC</option><option value="BTCLN">BTC · Lightning</option></optgroup>
<optgroup label="إيثيريوم"><option value="ETH">ETH</option><option value="USDTETH">USDT · ERC20</option><option value="USDCETH">USDC · ERC20</option><option value="WETHETH">WETH</option><option value="PEPEETH">PEPE</option><option value="LINKETH">LINK</option><option value="SHIBETH">SHIB</option><option value="AAVEETH">AAVE</option><option value="PAXGETH">PAXG</option><option value="XAUTETH">XAUT</option><option value="TUSDETH">TUSD</option><option value="USDSETH">USDS</option><option value="POLETH">POL</option></optgroup>
<optgroup label="ترون"><option value="TRX">TRX</option><option value="USDTTRX" selected>USDT · TRC20</option><option value="BTTTRX">BTT</option></optgroup>
<optgroup label="BNB Chain"><option value="BNBBSC">BNB</option><option value="USDTBSC">USDT · BEP20</option><option value="USDCBSC">USDC · BEP20</option><option value="BTCBSC">BTC · BEP20</option><option value="WBNBBSC">WBNB</option><option value="CAKEBSC">CAKE</option><option value="TWTBSC">TWT</option></optgroup>
<optgroup label="سولانا"><option value="SOL">SOL</option><option value="USDTSOL">USDT · SOL</option><option value="USDCSOL">USDC · SOL</option><option value="WSOLSOL">WSOL</option></optgroup>
<optgroup label="بوليجون"><option value="POLPOLYGON">POL</option><option value="USDTPOLYGON">USDT · Polygon</option><option value="USDC POLYGON">USDC · Polygon</option><option value="WETHPOLYGON">WETH · Polygon</option></optgroup>
<optgroup label="أربيتروم"><option value="ARBARBITRUM">ARB</option><option value="USDTARBITRUM">USDT · Arbitrum</option><option value="USDCARBITRUM">USDC · Arbitrum</option><option value="ETHARBITRUM">ETH · Arbitrum</option><option value="WETHARBITRUM">WETH · Arbitrum</option></optgroup>
<optgroup label="Base"><option value="ETHBASE">ETH · Base</option><option value="USDCBASE">USDC · Base</option><option value="WETHBASE">WETH · Base</option></optgroup>
<optgroup label="أوبتيميزم"><option value="ETHOPTIMISM">ETH · Optimism</option><option value="USDTOPTIMISM">USDT · Optimism</option><option value="USDCOPTIMISM">USDC · Optimism</option></optgroup>
<optgroup label="أفالانش"><option value="AVAXC-CHAIN">AVAX</option><option value="USDTC-CHAIN">USDT · AVAX</option><option value="USDCC-CHAIN">USDC · AVAX</option></optgroup>
<optgroup label="أخرى"><option value="XMR">XMR</option><option value="LTC">LTC</option><option value="DOGE">DOGE</option><option value="DASH">DASH</option><option value="ZEC">ZEC</option><option value="XRP">XRP</option><option value="ADA">ADA</option><option value="XLM">XLM</option><option value="SUI">SUI</option><option value="APT">APT</option><option value="ATOM">ATOM</option><option value="ETC">ETC</option><option value="VET">VET</option><option value="XTZ">XTZ</option><option value="S">S</option><option value="GRAMTON">GRAM · TON</option><option value="USDTTON">USDT · TON</option><option value="KCSKCC">KCS</option><option value="DOTAsset Hub">DOT</option><option value="BCH">BCH</option><option value="ZEC">ZEC</option></optgroup>
</select>
<input id="a" inputmode="decimal" placeholder="0.00">
</div>
<div class="mid"><button class="flip" id="flip" aria-label="عكس">⇅</button></div>
<div class="row">
<span class="ico btc" id="ti">₿</span>
<select id="t"><option value="BTC" selected>BTC</option></select>
<input id="out" readonly placeholder="0.00" tabindex="-1">
</div>
<div class="seg"><button class="on" data-v="fixed">سعر مقفول · 1%</button><button data-v="float">سعر عائم · 0.5%</button></div>
<input type="hidden" id="type" value="fixed">
<div class="fields">
<input id="addr" placeholder="عنوان الاستلام">
<input id="refund" placeholder="عنوان الاسترداد (اختياري)">
</div>
<div class="meta" id="m">أدخل مبلغاً لعرض السعر</div>
<button class="go" id="go" disabled>ابدأ التبديل</button>
</div>
</section>

<section id="view" hidden>
<h1>أرسل الآن.</h1>
<p class="lede" id="sum"></p>
<div class="card">
<img class="qr" id="qr" width="176" height="176" alt="QR">
<div class="addr" id="dep"></div>
<div class="meta" style="text-align:center">الحالة: <b id="st">بانتظار الإيداع</b> · <b id="clock"></b></div>
<div id="em" hidden class="fields"><div class="meta">المبلغ غير مطابق أو وصل متأخراً:</div><button class="gh" id="keep">متابعة بسعر السوق</button><button class="gh" id="back">استرداد إلى عنواني</button></div>
<button class="gh" id="new">طلب جديد</button>
</div>
</section>

<p class="foot">SudanPay واجهة مستقلة · التنفيذ والاسترداد عبر <a href="https://ff.io" rel="noopener">FixedFloat</a><br>🇸🇩 صُنع للسودان</p>
</main>
