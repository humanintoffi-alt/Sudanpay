<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SudanPay — تبديل عملات فوري 🇸🇩</title>
<meta name="description" content="بدّل BTC وUSDT وETH وXMR فوراً بلا حساب. بدّل، لا تحتفظ.">
<style>
*{box-sizing:border-box;margin:0}
:root{--red:#C1121F;--red2:#E23B2E;--sand:#F0E7D8;--ink:#08060A;--line:rgba(240,231,216,.14)}
html{overflow-x:hidden}
body{background:var(--ink);color:var(--sand);font:16px/1.55 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
.scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#0a0a1f;filter:saturate(115%) contrast(105%)}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(8,6,10,.35) 0%,rgba(8,6,10,.35) 40%,rgba(8,6,10,.9) 100%)}
main{position:relative;z-index:2;max-width:560px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:26px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand b{color:var(--red2)}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:11px;background:rgba(8,6,10,.5)}
.hero{text-align:center;margin:0 auto;max-width:520px;position:relative;padding:4px 0}
.hero:before{content:"";position:absolute;inset:-30px -18px;z-index:-1;filter:blur(8px);
background:radial-gradient(58% 68% at 50% 46%,rgba(6,4,9,.66),transparent 74%)}
.kick{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.16em;
color:#FFD9B0;background:rgba(10,7,12,.42);border:1px solid rgba(255,180,120,.28);
border-radius:99px;padding:6px 13px;margin-bottom:13px}
h1{font-size:clamp(26px,7.2vw,40px);line-height:1.18;letter-spacing:-.02em;font-weight:800;text-wrap:balance;
color:#FFF7EC;text-shadow:0 3px 28px rgba(0,0,0,.8);animation:wave 9s ease-in-out infinite}
h1 em{font-style:normal;background:linear-gradient(100deg,#FF8A6A,#FFC46B,#FF8A6A);
background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
animation:sheen 9s linear infinite}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-.3deg)}}
@keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.trio{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:15px;
font-size:12.5px;letter-spacing:.13em;color:#F3E5D2;opacity:.92;text-shadow:0 2px 14px rgba(0,0,0,.85)}
.trio i{width:4px;height:4px;border-radius:50%;background:#FF8A6A;opacity:.85}
.lede{opacity:.8;font-size:14px;margin-top:9px;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.card{margin:22px auto 0;width:100%;max-width:400px;background:rgba(12,9,16,.52);
backdrop-filter:blur(26px) saturate(155%);border:1px solid rgba(240,231,216,.18);
border-radius:26px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.leg{display:flex;justify-content:space-between;font-size:11.5px;opacity:.5;padding:12px 14px 6px}
.row{display:flex;align-items:center;gap:8px;background:rgba(240,231,216,.05);border-radius:18px;padding:9px 10px}
.row select{background:rgba(240,231,216,.07);border:1px solid rgba(240,231,216,.13);border-radius:13px;color:var(--sand);font:700 13px inherit;padding:9px 8px;max-width:47%;cursor:pointer;text-align:center;text-align-last:center}
.row select option,.row select optgroup{background:#121016;color:var(--sand)}
.row input{flex:1;min-width:0;background:none;border:0;color:var(--sand);font:700 21px inherit;text-align:left;padding:8px 4px}
.row input:focus{outline:0}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 system-ui;color:#fff;flex:0 0 auto}
.btc{background:#F7931A}.usdt{background:#26A17B}.eth{background:#627EEA}.xmr{background:#FF6600}
.trx{background:#E50914}.usdc{background:#2775CA}.sol{background:#9945FF}.ltc{background:#345D9D}.doge{background:#C2A633}
.mid{display:flex;justify-content:center;margin:-13px 0;position:relative;z-index:3}
.flip{width:42px;height:42px;border-radius:50%;background:#17131b;border:1px solid var(--line);color:var(--sand);font-size:16px;cursor:pointer;transition:.25s}
.flip:active{transform:rotate(180deg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 6px 0;background:rgba(240,231,216,.05);padding:5px;border-radius:14px}
.seg button{background:none;border:0;color:var(--sand);font:600 12.5px inherit;padding:10px;border-radius:10px;cursor:pointer;opacity:.55}
.seg button.on{background:rgba(193,18,31,.22);color:#fff;opacity:1;box-shadow:inset 0 0 0 1px rgba(226,59,46,.5)}
.fields{margin:12px 6px 0;display:grid;gap:8px}
.fields input{background:rgba(240,231,216,.05);border:1px solid transparent;border-radius:13px;padding:13px;color:var(--sand);font:inherit;font-size:13.5px}
.fields input:focus{outline:0;border-color:rgba(226,59,46,.55)}
.meta{margin:11px 10px 0;font-size:12.5px;opacity:.62;min-height:34px;line-height:1.5}
button.go{width:100%;margin:4px 0;background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;border:0;
border-radius:18px;padding:17px;font:800 15.5px inherit;cursor:pointer;box-shadow:0 10px 26px rgba(193,18,31,.35)}
button.go:disabled{opacity:.42;box-shadow:none;cursor:default}
.gh{background:rgba(240,231,216,.06);border:1px solid var(--line);color:var(--sand);border-radius:14px;padding:13px;font:600 13px inherit;width:100%;cursor:pointer}
.addr{font-family:monospace;font-size:12px;word-break:break-all;background:rgba(240,231,216,.07);padding:12px;border-radius:12px;margin:10px 0;text-align:center}
.qr{display:block;margin:12px auto;background:#fff;padding:9px;border-radius:14px}
.foot{margin-top:30px;font-size:11px;opacity:.45;line-height:1.9;text-align:center;text-shadow:0 1px 10px #000}
.foot a{color:#FF6A4D}
@media(prefers-reduced-motion:reduce){.scene{display:none}}

.hid{display:none!important}
.pick{background:rgba(240,231,216,.07);border:1px solid rgba(240,231,216,.13);border-radius:13px;
color:var(--sand);font:700 13px inherit;padding:9px 11px;max-width:52%;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,6,10,.94);backdrop-filter:blur(20px);
display:flex;flex-direction:column;padding:16px;max-width:560px;margin:auto}
.sheet input{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.14);border-radius:0;padding:14px 4px;color:var(--sand);font:inherit;font-size:15px}
.sheet input:focus{outline:0;border-color:#E23B2E}
#list{margin-top:12px;overflow-y:auto;flex:1}
.grp{font-size:11px;opacity:.45;margin:14px 4px 6px;letter-spacing:.08em}
.item{display:flex;align-items:center;gap:12px;padding:13px 4px;cursor:pointer;border-bottom:1px solid rgba(240,231,216,.06)}
.item:active{background:rgba(240,231,216,.08)}
.item .ico{width:36px;height:36px;font-size:12px}
.nm{flex:1;font-size:15px}.nm small{opacity:.5;font-size:12.5px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rt b{font-size:14px;font-weight:800;opacity:.9}
.x{position:absolute;top:16px;left:16px;background:none;border:0;color:var(--sand);font-size:22px;cursor:pointer}
.rate{font-size:11px;opacity:.45;padding:7px 8px 0}

.bdg{font-style:normal;font-size:8.5px;font-weight:800;background:rgba(255,255,255,.16);border-radius:5px;padding:2px 6px;letter-spacing:.05em}
</style></head><body>

<main>
<header><div class="brand" dir="ltr">Sudan<b>Pay</b> 🇸🇩</div><span class="pill">بلا حساب · بلا KYC</span></header>

</div>

<section id="view" hidden>

<button class="gh" id="new">طلب جديد</button>
</div>
</section>

<p class="foot">التنفيذ والاسترداد عبر FixedFloat<br>🇸🇩 صُنع للسودان</p>
</main>
<div class="sheet hid" id="sheet"><button class="x" id="x">✕</button><input id="q" placeholder="اكتب عملة أو شبكة…" autocomplete="off"><div id="list"></div></div>
